name: SecureNodeX CI

on:
  push:
    branches: [ "main", "m*/*", "feat/*", "fix/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    name: Backend & Storage (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Linter
        run: |
          ruff check .
          ruff format --check .

      - name: Run Mypy Type Checking
        run: |
          mypy backend storage simulator tools

      - name: Run Pytest Suite
        run: |
          pytest -v --cov=backend --cov=storage --cov-report=term-missing

  contracts:
    name: Smart Contracts (Solidity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: contracts/package.json

      - name: Install Hardhat dependencies
        run: |
          cd contracts
          npm install

      - name: Compile Contracts
        run: |
          cd contracts
          npx hardhat compile

  dashboard:
    name: Dashboard (Next.js 14)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: dashboard/package.json

      - name: Install Dashboard dependencies
        run: |
          cd dashboard
          npm install

      - name: Build Dashboard
        run: |
          cd dashboard
          npm run build

  gitleaks:
    name: Secrets Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
