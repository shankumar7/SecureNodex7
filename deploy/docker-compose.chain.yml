version: "3.8"

# SecureNodeX Hosts L2..L5: Besu QBFT Validator / RPC Node

services:
  besu-node:
    image: hyperledger/besu:24.7.0
    container_name: snx-besu-${NODE_NAME:-validator1}
    restart: unless-stopped
    environment:
      - BESU_LOGGING=INFO
    volumes:
      - ../chain/genesis.json:/opt/besu/genesis.json:ro
      - ../chain/keys/${NODE_NAME:-validator1}/key:/opt/besu/key:ro
      - ../chain/static-nodes.json:/opt/besu/static-nodes.json:ro
      - besu_data:/opt/besu/data
    ports:
      - "8545:8545"   # JSON-RPC (internal LAN only)
      - "8546:8546"   # WS-RPC
      - "30303:30303" # P2P discovery
    command:
      - --data-path=/opt/besu/data
      - --genesis-file=/opt/besu/genesis.json
      - --node-private-key-file=/opt/besu/key
      - --static-nodes-file=/opt/besu/static-nodes.json
      - --rpc-http-enabled=true
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-api=ETH,NET,QBFT,WEB3
      - --rpc-http-cors-origins=*
      - --rpc-ws-enabled=true
      - --rpc-ws-host=0.0.0.0
      - --rpc-ws-port=8546
      - --rpc-ws-api=ETH,NET,QBFT,WEB3
      - --p2p-enabled=true
      - --p2p-host=${HOST_IP:-127.0.0.1}
      - --p2p-port=30303
      - --min-gas-price=0
    healthcheck:
      test: ["CMD", "curl", "-X", "POST", "-H", "Content-Type: application/json", "--data", "{\"jsonrpc\":\"2.0\",\"method\":\"net_peerCount\",\"params\":[],\"id\":1}", "http://localhost:8545"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  besu_data:
