version: "3.8"

# SecureNodeX Host L1: Control Plane
# Services: PostgreSQL, snx-ca, snx-api, snx-worker, dashboard, prometheus, grafana

services:
  postgres:
    image: postgres:16-alpine
    container_name: snx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-snx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-snx_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-snx}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snx"]
      interval: 5s
      timeout: 3s
      retries: 5

  snx-ca:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ca
    container_name: snx-ca
    restart: unless-stopped
    environment:
      - CA_PORT=9443
    volumes:
      - ../pki:/app/pki
    ports:
      - "9443:9443"
    healthcheck:
      test: ["CMD", "curl", "-k", "-f", "https://localhost:9443/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  snx-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: snx-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8443:8443"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8443/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  snx-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
    container_name: snx-worker
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 5

  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    container_name: snx-dashboard
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:8443
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
