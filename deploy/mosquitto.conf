# SecureNodeX Mosquitto Broker Configuration (mTLS + ACL)

per_listener_settings true

listener 8883
protocol mqtt

cafile /mosquitto/pki/intermediate/ca-chain.pem
certfile /mosquitto/pki/intermediate/intermediate-ca.crt
keyfile /mosquitto/pki/intermediate/intermediate-ca.key

require_certificate true
use_identity_as_username true
tls_version tlsv1.2
ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256

allow_anonymous false
acl_file /mosquitto/config/mosquitto.acl
